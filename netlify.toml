[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API Route Proxies to Netlify Serverless Functions
[[redirects]]
  from = "/api/verify"
  to = "/.netlify/functions/verify"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Client-side SPA routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
